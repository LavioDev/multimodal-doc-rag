[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "multimodal-doc-rag"
version = "0.1.0"
description = "Multimodal retrieval augmented generation for complex documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<1",
    "alembic>=1.15,<2",
    "typer>=0.15,<1",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.11,<1"]
parsing = ["pypdfium2>=4.30,<6", "pypdf>=5.3,<7", "pillow>=10,<13", "unstructured[pdf]>=0.16,<1"]
models = ["fastembed>=0.7,<1", "httpx>=0.27,<1"]
evaluation = [
    "datasets>=3.2,<5",
    "langchain-community>=0.3.27,<0.4",
    "langchain-openai>=0.3,<2",
    "ragas>=0.2,<1",
    "rapidfuzz>=3.11,<4",
]

[project.scripts]
multimodal-rag = "multimodal_doc_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_doc_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

