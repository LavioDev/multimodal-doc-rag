services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: multimodal-doc-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multimodal_rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8.25.1
    container_name: multimodal-doc-rag-gotenberg
    restart: unless-stopped
    ports:
      - "${GOTENBERG_PORT:-3001}:3000"

volumes:
  postgres_data:
